# lazygit config — full reference:
# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
#
# Colors below are the Tokyo Night palette, to match nvim/ and yazi/.

gui:
  nerdFontsVersion: "3"
  showFileTree: true
  showCommandLog: false
  showRandomTip: false
  theme:
    lightTheme: false
    activeBorderColor:
      - "#7aa2f7"
      - bold
    inactiveBorderColor:
      - "#3b4261"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#283457"
    selectedRangeBgColor:
      - "#283457"
    cherryPickedCommitBgColor:
      - "#3b4261"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    unstagedChangesColor:
      - "#f7768e"
    defaultFgColor:
      - "#c0caf5"
    searchingActiveBorderColor:
      - "#e0af68"
git:
  diffRenderers:
    - command: delta --dark --paging=never # needs `git-delta` (see Brewfile)
  commit:
    signOff: false
update:
  method: never # brew/Brewfile owns updates, not lazygit's self-updater
disableStartupPopups: true
