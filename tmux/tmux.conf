# tmux.conf — symlinked to ~/.config/tmux/tmux.conf (tmux >= 3.1 reads it there).
# Reference: https://github.com/tmux/tmux/wiki
# Reload after editing: prefix + r (or `tmux source-file ~/.config/tmux/tmux.conf`).

# --- Basics -------------------------------------------------------------
set -g mouse on                  # click to switch panes, drag to resize
set -g base-index 1              # windows start at 1 (matches the keyboard row)
setw -g pane-base-index 1        # panes too
set -g renumber-windows on       # no gaps after closing a window
set -g history-limit 50000       # long Claude Code / test output stays scrollable
set -sg escape-time 10           # Esc reaches Neovim immediately (:checkhealth warns otherwise)
set -g focus-events on           # lets Neovim reload files Claude Code changed

# --- Vim muscle memory --------------------------------------------------
setw -g mode-keys vi             # copy mode: v to select, y to yank
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind h select-pane -L            # prefix + h/j/k/l moves between panes
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Terminal capabilities (Ghostty) -------------------------------------
# Without these, TUIs like yazi probe the terminal and the replies leak in
# as junk keystrokes. Declaring Ghostty's features up front avoids the probe.
set -g allow-passthrough on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:usstyle"
set -as terminal-features ",*:RGB"

# --- New windows/panes open in the current directory -------------------
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- Status line (Tokyo Night, to match nvim/ yazi/ lazygit/) -----------
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[default] "
set -g status-right "#[fg=#565f89]%H:%M "
setw -g window-status-current-style "fg=#7aa2f7,bold"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-style "fg=#3b4261"
